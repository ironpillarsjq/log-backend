[INPUT]
    Name         winlog
    Channels     Setup,Windows PowerShell,System,Application
    Interval_Sec 1
    Tag          windows.event.logs
    Db           ${FLB_DB_PATH}
    use_ansi     true
    # 指定该输入源使用磁盘缓冲机制
    storage.type  filesystem

[INPUT]
    Name         winlog
    Channels     Security
    Interval_Sec 1
    Tag          windows.security
    Db           ${FLB_SECURITY_DB_PATH}
    storage.type filesystem

[INPUT]
    Name         winlog
    Channels     Microsoft-Windows-PowerShell/Operational
    Interval_Sec 1
    Tag          windows.powershell
    Db           ${FLB_POWERSHELL_DB_PATH}
    storage.type filesystem

# 当前机器尚未安装或启用 Sysmon，因此先保留配置但不启用。
# 安装 Sysmon 并确认 Microsoft-Windows-Sysmon/Operational 通道存在后，
# 取消下面 INPUT 和对应 FILTER 的注释即可开始采集。
# [INPUT]
#     Name         winlog
#     Channels     Microsoft-Windows-Sysmon/Operational
#     Interval_Sec 1
#     Tag          windows.sysmon
#     Db           ${FLB_SYSMON_DB_PATH}
#     storage.type filesystem

[FILTER]
    Name          modify
    Match         windows.*
    # 动态获取当前 Windows 的计算机名作为客户端唯一 ID 传给后端
    Add           client_id  ${HOSTNAME}

[FILTER]
    Name          modify
    Match         windows.security
    Add           log_source security

[FILTER]
    Name          grep
    Match         windows.security
    Regex         EventID ^(1102|4616|4624|4625|4634|4647|4648|4657|4670|4672|4673|4674|4688|4697|4698|4699|4700|4701|4702|4704|4705|4719|4720|4722|4724|4725|4726|4728|4729|4732|4733|4738|4739|4756|4757|4768|4769|4771|4776)$

[FILTER]
    Name          modify
    Match         windows.powershell
    Add           log_source powershell

[FILTER]
    Name          grep
    Match         windows.powershell
    Regex         EventID ^(4103|4104|4105|4106)$

# [FILTER]
#     Name          modify
#     Match         windows.sysmon
#     Add           log_source sysmon

# [FILTER]
#     Name          grep
#     Match         windows.sysmon
#     Regex         EventID ^(1|3|10|11|12|13|14|17|18|19|20|21|22|25)$

[OUTPUT]
    Name          http
    Match         windows.*
    Host          ${SERVER_HOST}
    Port          ${SERVER_PORT}
    URI           /api/v1/logs                
    Format        json        
    Retry_Limit   False	
