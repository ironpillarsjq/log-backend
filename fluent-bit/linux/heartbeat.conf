# heartbeat.conf - Linux 客户端心跳配置

[INPUT]
    Name          dummy
    Tag           client.heartbeat
    Interval_Sec  5
    Dummy         {"status": "alive", "os": "linux"}

[FILTER]
    Name          modify
    Match         client.heartbeat
    Add           client_id  ${CLIENT_ID}

[OUTPUT]
    Name          http
    Match         client.heartbeat
    Host          ${SERVER_HOST}
    Port          ${SERVER_PORT}
    URI           /api/v1/heartbeat
    Format        json
    Retry_Limit   3
    net.keepalive Off
