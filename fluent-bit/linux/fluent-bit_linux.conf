@INCLUDE env.conf

[SERVICE]
    Flush                         1
    Daemon                        Off
    Log_Level                     info
    Parsers_File                  parsers.conf
    Plugins_File                  plugins.conf

    storage.path                  ${FLB_BUFFER_PATH}
    storage.sync                  normal
    storage.checksum              off
    storage.backlog.mem_limit     50M
    storage.max_chunks_up         128

    scheduler.base                3
    scheduler.cap                 30

@INCLUDE log_transfer.conf
#@INCLUDE heartbeat.conf