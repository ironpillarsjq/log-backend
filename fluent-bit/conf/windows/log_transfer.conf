[INPUT]
    Name         winlog
    Channels     Setup,Windows PowerShell,System,Application
    Interval_Sec 1
    Tag          windows.event.logs
    Db           ${FLB_DB_PATH}
    use_ansi     true
    # 指定该输入源使用磁盘缓冲机制
    storage.type  filesystem

[FILTER]
    Name          modify
    Match         windows.event.logs
    # 动态获取当前 Windows 的计算机名作为客户端唯一 ID 传给后端
    Add           client_id  ${HOSTNAME}

[OUTPUT]
    Name          http
    Match         windows.event.logs
    Host          ${SERVER_HOST}
    Port          ${SERVER_PORT}
    URI           /api/v1/logs                
    Format        json        
    Retry_Limit   False	