# heartbeat.conf

[INPUT]
    Name         dummy
    Tag          client.heartbeat
    Interval_Sec 5
    Dummy        {"status": "alive"}

[FILTER]
    Name          modify
    Match         client.heartbeat
    Add           client_id  ${COMPUTERNAME}

[OUTPUT]
    Name          http
    Match         client.heartbeat
    Host          ${SERVER_HOST}
    Port          ${SERVER_PORT}                   
    URI           /api/v1/heartbeat           
    Format        json        
    Retry_Limit   3
# 👇 关键改动 1：关闭长连接，防止本地测试时吃死连接
    net.keepalive Off